<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Maths Malins</title>
<meta name="theme-color" content="#6c5ce7">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff8e7;--ink:#2d3436;--card:#ffffff;--ok:#00b894;--bad:#ff7675;--accent:#6c5ce7;--muted:#636e72}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Fredoka',system-ui,sans-serif;min-height:100vh;overflow-x:hidden}
#app{max-width:560px;margin:0 auto;padding:16px}
button{font-family:inherit;cursor:pointer;color:inherit}
header{display:flex;align-items:center;justify-content:space-between;gap:8px}
h1{font-size:1.7rem;margin:0}
.toggles{display:flex;gap:8px}
.iconbtn,.toggles button{border:none;background:var(--card);border-radius:14px;font-size:1.3rem;width:46px;height:46px;box-shadow:0 3px 0 rgba(0,0,0,.1)}
.off{opacity:.35}
.hello{background:var(--accent);color:#fff;border-radius:20px;padding:14px 16px;margin:14px 0;font-size:1.15rem}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{border:none;border-radius:20px;padding:16px 8px;color:#fff;text-align:center;box-shadow:0 5px 0 rgba(0,0,0,.18)}
.card:active,.ch:active,.btn:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.15)}
.card .ic{font-size:2.3rem;display:block}
.card .nm{font-size:1.1rem;font-weight:600;display:block;margin:4px 0}
.card .st{font-size:1.1rem;letter-spacing:2px;display:block}
.card .lv{font-size:.85rem;opacity:.95}
.foot{text-align:center;color:var(--muted);font-size:.9rem;margin-top:18px}
.top{display:flex;align-items:center;gap:10px}
.bar{flex:1;height:14px;background:#e9dfc9;border-radius:10px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok);transition:width .3s}
.sc{font-weight:700;font-size:1.2rem;min-width:52px;text-align:right}
.qcard{background:var(--card);border-radius:24px;padding:22px 12px 16px;margin:16px 0;text-align:center;box-shadow:0 4px 0 rgba(0,0,0,.08);position:relative;min-height:190px}
.qcard .iconbtn{position:absolute;top:10px;right:10px;background:var(--bg);box-shadow:none}
.ask{font-size:1.3rem;margin:4px 44px 10px}
.big{font-size:2.7rem;font-weight:700;margin:8px 0}
.qm{color:var(--accent)}
.objs{display:flex;flex-wrap:wrap;justify-content:center;gap:4px;font-size:2rem;margin:6px 0;line-height:1.2}
.grid5{display:grid;grid-template-columns:repeat(5,auto);justify-content:center}
.gone{filter:grayscale(1);opacity:.3}
.plus{font-size:2rem;font-weight:700;color:var(--accent)}
.frame{display:inline-grid;grid-template-columns:repeat(5,40px);gap:5px;margin:10px auto}
.frame span{width:40px;height:40px;border:3px solid #b2bec3;border-radius:9px}
.frame span.f{background:#fdcb6e;border-color:#e1a32c}
.seq{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:14px 0}
.seq b{background:var(--bg);border-radius:12px;padding:8px 12px;font-size:1.7rem}
.seq b.q{background:var(--accent);color:#fff}
.hint{font-size:1rem;color:var(--muted);margin:6px 0 0}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.choices.three{grid-template-columns:1fr 1fr 1fr}
.ch{border:none;border-radius:20px;background:var(--card);font-size:2.1rem;font-weight:700;padding:18px 0;box-shadow:0 5px 0 rgba(0,0,0,.12)}
.ch.good{background:var(--ok);color:#fff}
.ch.bad{background:var(--bad);color:#fff;animation:shake .4s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.fb{text-align:center;font-size:1.4rem;font-weight:600;min-height:2.2em;margin-top:16px}
.fb.ok{color:var(--ok);animation:pop .35s}
.fb.no{color:#d63031}
@keyframes pop{0%{transform:scale(.6)}70%{transform:scale(1.15)}100%{transform:scale(1)}}
.end{text-align:center;padding-top:20px}
.end .emo{font-size:5rem}
.end h2{font-size:2rem;margin:6px 0}
.end .res{font-size:1.6rem;font-weight:600}
.end .stars{font-size:3.2rem;letter-spacing:6px;color:#f0a500;margin:8px 0}
.lvl{background:#fff;border-radius:16px;padding:10px;font-size:1.15rem;font-weight:600}
.btn{display:block;width:100%;border:none;border-radius:20px;background:var(--accent);color:#fff;font-size:1.4rem;font-weight:600;padding:16px;margin-top:14px;box-shadow:0 5px 0 rgba(0,0,0,.18)}
.btn.sec{background:var(--card);color:var(--ink)}
.conf{position:fixed;top:-50px;font-size:1.9rem;pointer-events:none;animation:fall 2.3s linear forwards;z-index:9}
@keyframes fall{to{transform:translateY(115vh) rotate(360deg)}}
</style>
</head>
<body>
<div id="app"></div>
<script>
const ACT=[
  {id:'count',  name:'Compter',          icon:'🍎', color:'#e85a5a'},
  {id:'add',    name:'Additions',        icon:'➕', color:'#00a07a'},
  {id:'sub',    name:'Soustractions',    icon:'➖', color:'#0984e3'},
  {id:'compare',name:'Plus grand ?',     icon:'⚖️', color:'#e09400'},
  {id:'double', name:'Doubles & moitiés',icon:'👯', color:'#d35400'},
  {id:'table',  name:'Tables',           icon:'✖️', color:'#6c5ce7'},
  {id:'comp',   name:'Faire 10',         icon:'🔟', color:'#00999a'},
  {id:'suite',  name:'Suites',           icon:'🔢', color:'#d63384'}
];
const FRUITS=['🍎','🍓','🍌','⭐','🐟','🎈','🌸','🐞','🍪','🚗','🐣','⚽'];
const BRAVO=['Bravo !','Super !','Génial !','Trop fort !','Parfait !','Excellent !','Champion !'];
const FX=['🎉','⭐','🚀','💪','🌟','🦉','✨'];

const store={
  get(k,d){try{const v=localStorage.getItem('mm_'+k);return v?JSON.parse(v):d;}catch(e){return d;}},
  set(k,v){try{localStorage.setItem('mm_'+k,JSON.stringify(v));}catch(e){}}
};
let progress=store.get('progress',{});
let settings=store.get('settings',{voice:true,sound:true});
const app=document.getElementById('app');
let game=null,timer=null;

function rand(a,b){return Math.floor(Math.random()*(b-a+1))+a;}
function pick(a){return a[rand(0,a.length-1)];}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=rand(0,i);[a[i],a[j]]=[a[j],a[i]];}return a;}
function stars(n){return '★'.repeat(n)+'☆'.repeat(3-n);}
function disp(v){return v==='<'?'&lt;':v==='>'?'&gt;':v;}
function numChoices(ans){
  const s=new Set([ans]);
  for(const o of shuffle([1,-1,2,-2,10,-10,3,-3])){if(s.size>=4)break;const v=ans+o;if(v>=0)s.add(v);}
  let k=4;while(s.size<4)s.add(ans+k++);
  return shuffle([...s]);
}
function row(n,e,goneFrom){
  let h='';for(let i=0;i<n;i++)h+=`<span class="${goneFrom!=null&&i>=goneFrom?'gone':''}">${e}</span>`;
  return `<div class="objs">${h}</div>`;
}

/* ---------- Générateurs de questions (niveau 1 à 3) ---------- */
const GEN={
  count(l){
    const n=rand(l===1?1:6,[10,15,20][l-1]),e=pick(FRUITS);
    return {html:`<p class="ask">Combien y en a-t-il ?</p><div class="objs grid5">${(`<span>${e}</span>`).repeat(n)}</div>`,
      speak:'Combien y en a-t-il ?',answer:n,choices:numChoices(n)};
  },
  add(l){
    let a,b,vis='';
    if(l===1){a=rand(1,5);b=rand(1,10-a);const e=pick(FRUITS);vis=row(a,e)+'<div class="plus">+</div>'+row(b,e);}
    else if(l===2){a=rand(5,15);b=rand(2,20-a);}
    else if(Math.random()<.5){a=rand(1,8)*10+rand(0,5);b=rand(1,9-a%10);}
    else{a=rand(1,5)*10;b=rand(1,4)*10;}
    return {html:`<div class="big">${a} + ${b} = <span class="qm">?</span></div>${vis}`,
      speak:`Combien font ${a} plus ${b} ?`,answer:a+b,choices:numChoices(a+b)};
  },
  sub(l){
    let a,b,vis='';
    if(l===1){a=rand(3,10);b=rand(1,a-1);vis=row(a,pick(FRUITS),a-b)+`<p class="hint">On en enlève ${b}</p>`;}
    else if(l===2){a=rand(10,20);b=rand(1,10);}
    else if(Math.random()<.5){a=rand(2,9)*10+rand(1,9);b=rand(1,a%10);}
    else{a=rand(3,9)*10;b=rand(1,a/10-1)*10;}
    return {html:`<div class="big">${a} − ${b} = <span class="qm">?</span></div>${vis}`,
      speak:`Combien font ${a} moins ${b} ?`,answer:a-b,choices:numChoices(a-b)};
  },
  compare(l){
    const max=[20,50,100][l-1],a=rand(0,max);let b;
    if(Math.random()<.2)b=a;else{do{b=rand(Math.max(0,a-(l===1?10:20)),Math.min(max,a+(l===1?10:20)));}while(b===a);}
    const ans=a<b?'<':a>b?'>':'=';
    return {html:`<p class="ask">Quel est le bon signe ?</p><div class="big">${a} <span class="qm">?</span> ${b}</div><p class="hint">&lt; plus petit · = égal · &gt; plus grand</p>`,
      speak:`${a} est-il plus petit, égal ou plus grand que ${b} ?`,answer:ans,choices:['<','=','>'],
      say:{'<':'plus petit que','=':'égal à','>':'plus grand que'}[ans]};
  },
  double(l){
    let isHalf=l>1&&Math.random()<.5,n,ans,vis='';
    if(isHalf){n=(l===2?rand(1,10):rand(5,30))*2;ans=n/2;}
    else{n=l===1?rand(1,5):l===2?rand(2,10):rand(11,25);ans=n*2;if(l===1){const e=pick(FRUITS);vis=row(n,e)+row(n,e);}}
    const t=isHalf?`La moitié de ${n}`:`Le double de ${n}`;
    return {html:`<p class="ask">${t} ?</p><div class="big">${isHalf?n+' ÷ 2':n+' + '+n} = <span class="qm">?</span></div>${vis}`,
      speak:`Quel est ${t.toLowerCase()} ?`,answer:ans,choices:numChoices(ans)};
  },
  table(l){
    const t=pick([[2],[2,5,10],[2,3,4,5,10]][l-1]),f=rand(1,10);
    return {html:`<p class="ask">Table de ${t}</p><div class="big">${f} × ${t} = <span class="qm">?</span></div>`,
      speak:`Combien font ${f} fois ${t} ?`,answer:f*t,choices:numChoices(f*t)};
  },
  comp(l){
    let t,a,vis='';
    if(l===1){t=10;a=rand(1,9);vis='<div class="frame">'+Array.from({length:10},(_,i)=>`<span class="${i<a?'f':''}"></span>`).join('')+'</div>';}
    else if(l===2){t=20;a=rand(5,19);}
    else{t=100;a=rand(1,9)*10;}
    return {html:`<p class="ask">Pour faire ${t}</p><div class="big">${a} + <span class="qm">?</span> = ${t}</div>${vis}`,
      speak:`Combien faut-il ajouter à ${a} pour faire ${t} ?`,answer:t-a,choices:numChoices(t-a)};
  },
  suite(l){
    let step,start;
    if(l===1){step=pick([1,2]);start=rand(0,12);}
    else if(l===2){step=pick([2,5,10]);start=step*rand(0,6);}
    else{step=pick([5,10,-1,-2,-10]);start=step>0?step*rand(2,10):rand(50,100);}
    const seq=[0,1,2,3].map(i=>start+i*step),ans=start+4*step;
    return {html:`<p class="ask">Quel nombre vient après ?</p><div class="seq">${seq.map(n=>`<b>${n}</b>`).join('')}<b class="q">?</b></div><p class="hint">${step>0?'On avance de '+step:'On recule de '+(-step)}</p>`,
      speak:'Quel nombre vient après ?',answer:ans,choices:numChoices(ans)};
  }
};

/* ---------- Voix et sons ---------- */
function say(t){
  if(!settings.voice)return;
  try{if(!('speechSynthesis' in window))return;speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(t);u.lang='fr-FR';u.rate=.9;
    const v=speechSynthesis.getVoices().find(v=>v.lang&&v.lang.toLowerCase().startsWith('fr'));if(v)u.voice=v;
    speechSynthesis.speak(u);}catch(e){}
}
let actx;
function beep(ok){
  if(!settings.sound)return;
  try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();
    (ok?[523,659,784]:[330,220]).forEach((f,i)=>{
      const o=actx.createOscillator(),g=actx.createGain(),t=actx.currentTime+i*.12;
      o.type=ok?'triangle':'sine';o.frequency.value=f;
      g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.25,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+.25);
      o.connect(g).connect(actx.destination);o.start(t);o.stop(t+.3);});
  }catch(e){}
}
function confetti(){
  for(let i=0;i<30;i++){const s=document.createElement('span');s.className='conf';s.textContent=pick(['🎉','⭐','🎈','✨']);
    s.style.left=rand(0,95)+'vw';s.style.animationDelay=(Math.random()*.7)+'s';document.body.appendChild(s);setTimeout(()=>s.remove(),3200);}
}

/* ---------- Écrans ---------- */
function renderHome(){
  clearTimeout(timer);game=null;
  const total=ACT.reduce((s,a)=>s+((progress[a.id]||{}).best||0),0);
  app.innerHTML=`<header><h1>🦉 Maths Malins</h1><div class="toggles">
    <button data-act="voice" class="${settings.voice?'':'off'}" aria-label="Voix">🗣️</button>
    <button data-act="sound" class="${settings.sound?'':'off'}" aria-label="Sons">🔔</button></div></header>
    <div class="hello">Bonjour ! Choisis un jeu. Tu as gagné <b>${total}</b> ⭐</div>
    <div class="cards">${ACT.map(a=>{const p=progress[a.id]||{level:1,best:0};
      return `<button class="card" style="background:${a.color}" data-act="start" data-id="${a.id}">
        <span class="ic">${a.icon}</span><span class="nm">${a.name}</span><span class="st">${stars(p.best)}</span><span class="lv">Niveau ${p.level}</span></button>`;}).join('')}</div>
    <p class="foot">10 questions par partie · le niveau s'adapte tout seul</p>`;
}
function startGame(id){
  const p=progress[id]||{level:1,best:0};
  game={id,level:p.level,i:0,score:0,total:10,q:null,locked:false,last:''};
  nextQ();
}
function nextQ(){
  if(!game)return;
  if(game.i>=game.total)return endGame();
  let q,n=0;do{q=GEN[game.id](game.level);}while(q.html===game.last&&++n<6);
  game.q=q;game.last=q.html;game.locked=false;renderGame();say(q.speak);
}
function renderGame(){
  const q=game.q;
  app.innerHTML=`<div class="top"><button class="iconbtn" data-act="home" aria-label="Menu">✕</button>
    <div class="bar"><i style="width:${game.i/game.total*100}%"></i></div><span class="sc">⭐ ${game.score}</span></div>
    <div class="qcard"><button class="iconbtn" data-act="speak" aria-label="Écouter">🔊</button>${q.html}</div>
    <div class="choices ${q.choices.length===3?'three':''}">${q.choices.map((c,i)=>`<button class="ch" data-act="choice" data-i="${i}">${disp(c)}</button>`).join('')}</div>
    <div class="fb" id="fb"></div>`;
}
function choose(btn){
  if(!game||game.locked)return;game.locked=true;
  const q=game.q,ok=String(q.choices[+btn.dataset.i])===String(q.answer),fb=document.getElementById('fb');
  if(ok){btn.classList.add('good');game.score++;const w=pick(BRAVO);fb.textContent=w+' '+pick(FX);fb.className='fb ok';beep(true);say(w);}
  else{
    btn.classList.add('bad');
    document.querySelectorAll('.ch').forEach(b=>{if(String(q.choices[+b.dataset.i])===String(q.answer))b.classList.add('good');});
    fb.innerHTML=`Presque ! C'était <b>${disp(q.answer)}</b>`;fb.className='fb no';beep(false);
    say(`Presque ! La bonne réponse était ${q.say||q.answer}.`);
  }
  game.i++;
  document.querySelector('.bar i').style.width=(game.i/game.total*100)+'%';
  document.querySelector('.sc').textContent='⭐ '+game.score;
  timer=setTimeout(nextQ,ok?1300:2800);
}
function endGame(){
  const s=game.score,st=s>=9?3:s>=7?2:s>=5?1:0,p=progress[game.id]||{level:1,best:0};let msg='';
  if(s>=8&&p.level<3){p.level++;msg='🎁 Niveau '+p.level+' débloqué !';}
  else if(s<=4&&p.level>1){p.level--;msg='On s\'entraîne avec un niveau plus facile.';}
  p.best=Math.max(p.best||0,st);progress[game.id]=p;store.set('progress',progress);
  const emo=['🙂','😊','😄','🤩'][st],txt=['Continue, tu vas y arriver !','Bien joué !','Très bien !','Champion !'][st];
  app.innerHTML=`<div class="end"><div class="emo">${emo}</div><h2>${txt}</h2>
    <div class="res">${s} / ${game.total} bonnes réponses</div><div class="stars">${stars(st)}</div>
    ${msg?`<p class="lvl">${msg}</p>`:''}
    <button class="btn" data-act="replay">🔁 Rejouer</button><button class="btn sec" data-act="home">🏠 Menu</button></div>`;
  say(`${txt} Tu as ${s} bonnes réponses sur ${game.total}.`);
  if(st>=2)confetti();
}

app.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;
  const a=b.dataset.act;
  if(a==='start')startGame(b.dataset.id);
  else if(a==='choice')choose(b);
  else if(a==='speak'&&game)say(game.q.speak);
  else if(a==='home'){try{speechSynthesis.cancel();}catch(e){}renderHome();}
  else if(a==='replay')startGame(game.id);
  else if(a==='voice'||a==='sound'){settings[a]=!settings[a];store.set('settings',settings);if(a==='voice'&&!settings.voice){try{speechSynthesis.cancel();}catch(e){}}renderHome();}
});
try{speechSynthesis.getVoices();}catch(e){}
renderHome();
</script>
</body>
</html>
